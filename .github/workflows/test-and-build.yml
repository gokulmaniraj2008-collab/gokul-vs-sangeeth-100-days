name: Test and build

on:
  pull_request:
  push:
    branches:
      - main
      - fix/instagram-auth-timing-safe

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run endpoint tests
        run: npm test
      - name: Build website
        run: npm run build
